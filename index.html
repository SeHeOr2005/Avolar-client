<!doctype html>
<html lang="es" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AVOLAR Smoke Shop: reserva consolas para jugar en la tienda y descubre nuestra ropa. Sin registro, reserva en minutos." />
    <meta name="theme-color" content="#0c0614" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Unbounded:wght@500;700;800&family=Yellowtail&display=swap" rel="stylesheet" />
    <title>A volar</title>
    <script>
      // Aplica el modo guardado antes de pintar para evitar el parpadeo de tema.
      (function () {
        try {
          var t = localStorage.getItem('avolar-theme');
          if (t !== 'day' && t !== 'night') {
            var h = new Date().getHours();
            t = h >= 6 && h < 18 ? 'day' : 'night';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
